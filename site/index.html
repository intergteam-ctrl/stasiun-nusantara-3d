<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: full-screen 3D stage with HUD + panels floating over it. Look: bright cartoon daytime — sky blue, sunny orange, mint, chunky rounded "toy" UI. Single deliberate light look. */
:root{
  --sky:#cdeeff;          /* latar langit */
  --panel:#ffffff;
  --panel-2:#f2f7fc;
  --sunk:#e9f1f9;         /* bidang cekung / track bar */
  --line:#d5e2f0;
  --line-2:#b9cde3;
  --enamel:#ffffff;
  --navy:#1d3f73;
  --text:#1f3557;
  --muted:#6b7f9e;
  --accent:#ff8a2a;       /* oranye ceria */
  --accent-2:#e86f0c;     /* bayangan tombol oranye */
  --accent-ink:#ffffff;
  --go:#22b573; --go-2:#16905a; --go-ink:#11804f; --go-soft:#e3f8ee;
  --stop:#f0505a; --stop-2:#c93640; --stop-ink:#d22f3a; --stop-soft:#ffe6e8;
  --warn:#f5b41a; --warn-ink:#9a6400; --warn-soft:#fff4d6;
  --info:#3a8ef6; --info-soft:#e4efff;
  --teal:#2fc3c6;
  --font-display:"Fredoka","Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:16px;
  --shadow:0 6px 0 rgba(29,63,115,.08), 0 12px 28px rgba(29,63,115,.12);
  color-scheme:light;
}
html,body{height:100%;}
body{background:var(--sky);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;}
button,select,input{font-family:inherit;font-size:inherit;color:inherit;}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#6cc4ff 0%,#bfe7ff 55%,#fff1d6 100%);}
#gl,#ppka{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#ppka{background:#d9efff;}
.layer{position:absolute;inset:0;pointer-events:none;}
.layer > *{pointer-events:auto;}
/* ---------- type ---------- */
.disp{font-family:var(--font-display);letter-spacing:.01em;line-height:1.05;text-wrap:balance;color:var(--navy);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;color:var(--accent-2);font-weight:600;}
.muted{color:var(--muted);}
h2.disp{font-size:clamp(28px,5vw,44px);font-weight:700;margin:0;}
h3.disp{font-size:22px;font-weight:600;margin:0;}
p{line-height:1.55;margin:0;}
/* ---------- buttons (chunky toy buttons) ---------- */
.btn{box-sizing:border-box;appearance:none;border:2px solid var(--line-2);background:var(--panel);color:var(--navy);padding:9px 16px;border-radius:14px;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;box-shadow:0 4px 0 var(--line-2);transition:transform .08s, box-shadow .08s, background .15s;}
.btn:hover{background:var(--panel-2);}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-2);}
.btn:focus-visible,select:focus-visible,input:focus-visible,.seat:focus-visible,.tool:focus-visible,.lever:focus-visible{outline:3px solid var(--info);outline-offset:2px;}
.btn.primary{background:var(--accent);border-color:var(--accent-2);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-2);}
.btn.primary:hover{background:#ff9a45;}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-2);}
.btn.go{background:var(--go);border-color:var(--go-2);color:#fff;box-shadow:0 4px 0 var(--go-2);}
.btn.stop{background:var(--stop);border-color:var(--stop-2);color:#fff;box-shadow:0 4px 0 var(--stop-2);}
.btn.ghost{background:rgba(255,255,255,.6);}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:11px;box-shadow:0 3px 0 var(--line-2);}
.btn.primary.sm{box-shadow:0 3px 0 var(--accent-2);}.btn.stop.sm{box-shadow:0 3px 0 var(--stop-2);}.btn.go.sm{box-shadow:0 3px 0 var(--go-2);}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow:auto;padding-inline:16px;padding-block:24px;display:flex;justify-content:center;align-items:flex-start;}
.screen.center{align-items:center;}
.sheet{width:min(1040px,100%);display:flex;flex-direction:column;gap:20px;}
.panel{background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(6px);}
/* title board */
.board{background:var(--enamel);color:var(--navy);border-radius:26px;padding:20px 26px 32px;box-shadow:0 0 0 7px var(--navy), 0 0 0 12px #ffd36b, 0 24px 50px rgba(29,63,115,.3);position:relative;text-align:center;max-width:640px;width:100%;}
.board .elev{position:absolute;right:18px;bottom:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;}
.board .km{position:absolute;left:18px;bottom:10px;font-family:var(--font-mono);font-size:12px;font-weight:700;}
.board h1{font-family:var(--font-display);font-weight:700;font-size:clamp(42px,9vw,86px);letter-spacing:.02em;margin:8px 0 2px;line-height:.95;color:var(--navy);}
.board h1 span{color:var(--accent);}
.board .sub{font-family:var(--font-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12px,2.2vw,16px);color:var(--muted);}
.board .badge3d{display:inline-block;margin-top:6px;background:var(--teal);color:#fff;font-family:var(--font-display);font-weight:700;border-radius:999px;padding:2px 14px;letter-spacing:.2em;}
.board .legs{position:absolute;bottom:-50px;width:14px;height:44px;background:var(--navy);border-radius:7px;}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:60px;width:min(720px,100%);}
.menu{display:flex;flex-direction:column;gap:12px;width:min(420px,100%);}
.menu .btn{width:100%;min-height:50px;font-size:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;}
.field input,.field select,select.inp{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;color:var(--text);font-weight:700;}
input[type=range]{accent-color:var(--accent);}
/* career ladder */
.ladder{display:grid;gap:12px;}
.rung{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow);}
.rung .lv{font-family:var(--font-display);font-weight:700;font-size:30px;color:#fff;text-align:center;background:var(--accent);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-2);}
.rung.locked{opacity:.55;filter:grayscale(.6);}
.rung .meta{min-width:0;display:flex;flex-direction:column;gap:4px;}
.rung .meta b{font-size:16px;color:var(--navy);}
.grade{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-family:var(--font-display);font-weight:700;font-size:24px;color:#fff;}
.grade.A{background:var(--go)}.grade.B{background:var(--info)}.grade.C{background:var(--warn);color:#4a3200}.grade.D{background:var(--stop)}.grade.none{background:var(--sunk);color:var(--muted)}
@media (max-width:560px){.rung{grid-template-columns:52px 1fr;}.rung .lv{width:46px;height:46px;font-size:24px}.rung .act{grid-column:1/-1}}
/* guide */
.tabs{display:flex;flex-wrap:wrap;gap:6px;}
.tab{padding:7px 13px;border-radius:999px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800;color:var(--navy);}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.tbl-wrap{overflow-x:auto;}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
table.t th,table.t td{border-bottom:2px solid var(--sunk);padding:9px 10px;text-align:left;vertical-align:top;}
table.t th{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--muted);font-weight:600;}
table.t td.num{font-family:var(--font-mono);text-align:right;white-space:nowrap;}
ul.sop{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.5;}
/* ---------- HUD ---------- */
#hud{display:flex;flex-direction:column;}
.topbar{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;white-space:nowrap;font-weight:700;color:var(--navy);box-shadow:0 3px 0 rgba(29,63,115,.08);}
.chip b{font-family:var(--font-mono);font-weight:700;}
.chip.title{background:var(--navy);color:#fff;border-color:var(--navy);font-family:var(--font-display);font-weight:600;letter-spacing:.03em;font-size:14px;}
.chip.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn-ink)}.chip.bad{border-color:var(--stop);background:var(--stop-soft);color:var(--stop-ink)}.chip.good{border-color:var(--go);background:var(--go-soft);color:var(--go-ink)}
.spacer{flex:1;}
.meter{width:70px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:inline-block;}
.meter > i{display:block;height:100%;background:var(--go);border-radius:4px;}
.bottombar{margin-top:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:78px;padding:8px 8px 6px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.96);cursor:pointer;font-size:11.5px;font-weight:800;color:var(--navy);box-shadow:0 4px 0 var(--line-2);transition:transform .08s;}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-2);}
.tool .ic{font-size:22px;line-height:1;}
.tool .k{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.tool.on{border-color:var(--accent);background:#fff1e3;box-shadow:0 4px 0 var(--accent-2);transform:translateY(-3px);}
.tool .st{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
/* panel persiapan troli (Level 1): bisa digulir, tombol mulai selalu terlihat */
.panel.prep{margin:auto 12px 12px;max-width:520px;width:calc(100% - 24px);align-self:flex-start;display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:calc(100% - 70px);min-height:0}
.prep-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:14px 16px 6px;min-height:0;flex:1 1 auto}
.prep-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:2px solid var(--sunk);background:#fff;flex:none}
@media (max-height:520px) and (orientation:landscape){
  .panel.prep{max-width:640px;max-height:calc(100% - 56px);margin:auto 8px 6px}
  .prep-help{display:none}
  .prep-rows{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .prep-rows .staff{grid-template-columns:1fr 60px auto!important;padding:5px 0;font-size:12px}
  .prep-foot{padding:6px 12px}
}
/* online: masukan, tantangan harian */
.stars{display:flex;gap:6px;justify-content:center;margin-top:6px}
.star{font-size:38px;line-height:1;background:none;border:none;color:var(--line-2);cursor:pointer;padding:2px 4px;transition:transform .1s}
.star.on{color:#f5b41a;transform:scale(1.08)}
.field textarea{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font-weight:600;resize:vertical;min-height:70px;font-family:inherit}
.btn.daily{background:#fff6d6;border-color:#f5b41a;box-shadow:0 4px 0 #d39a10;color:#7a4b00}
table.lb tr.me td{background:var(--go-soft)}
/* poin kinerja */
.chip.coin{background:#fff6d6;border-color:#f5b41a;color:#8a5a00}
.chip.coin.bump{animation:bump .35s cubic-bezier(.3,1.8,.6,1)}
@keyframes bump{40%{transform:scale(1.25)}}
.coinpop{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-size:20px;color:#f5a000;text-shadow:0 2px 0 #fff,0 0 6px #fff;pointer-events:none;animation:coinup 1.1s ease-out forwards;z-index:30}
@keyframes coinup{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}20%{transform:translate(-50%,-70%) scale(1.15)}to{opacity:0;transform:translate(-50%,-180%) scale(1)}}
/* toasts */
#toasts{position:absolute;bottom:calc(118px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;align-items:center;pointer-events:none;z-index:40;width:min(520px,calc(100% - 32px));}
.toast{background:#fff;border:2px solid var(--line);border-left:6px solid var(--info);padding:9px 13px;border-radius:14px;font-size:13px;font-weight:700;color:var(--text);box-shadow:var(--shadow);animation:tin .25s cubic-bezier(.3,1.6,.6,1);width:100%;}
.toast.good{border-left-color:var(--go)}.toast.bad{border-left-color:var(--stop)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
/* modal */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(29,63,115,.28);backdrop-filter:blur(2px);z-index:50;}
#modal .box{width:min(620px,100%);max-height:calc(100% - 16px);overflow:auto;background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(29,63,115,.1),0 30px 70px rgba(29,63,115,.3);animation:pop .28s cubic-bezier(.3,1.5,.6,1);}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#modal .box.wide{width:min(980px,100%);}
#modal .box.crisis{border-color:var(--stop);box-shadow:0 0 0 4px var(--stop-soft),0 8px 0 rgba(201,54,64,.25),0 30px 70px rgba(29,63,115,.3);}
.sla{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--stop-ink);}
/* generic grids */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;}
.kv dt{color:var(--muted);}
.kv dd{margin:0;font-weight:800;min-width:0;overflow-wrap:anywhere;}
.bar{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--go);border-radius:5px;}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;border:2px solid var(--line);background:var(--panel);}
.tag.go{color:var(--go-ink);border-color:#9fe0c1;background:var(--go-soft)}.tag.stop{color:var(--stop-ink);border-color:#f7b2b7;background:var(--stop-soft)}.tag.warn{color:var(--warn-ink);border-color:#f7d98a;background:var(--warn-soft)}
/* ---------- Level 2: loket ---------- */
.l2{position:absolute;inset:0;display:grid;grid-template-columns:260px 1fr 300px;gap:12px;padding:64px 12px 12px;background:linear-gradient(#e7f6ff,#fff6e6);}
.l2 .col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;}
.queue{display:flex;flex-direction:column;gap:6px;}
.qp{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;background:var(--panel-2);border:2px solid var(--line);font-size:12px;}
.qp canvas{border-radius:10px;flex:none}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
.ktp{background:linear-gradient(135deg,#9fd6f7,#d8f0ff 60%,#b9e2fb);color:#0b2a45;border-radius:16px;padding:10px 12px;font-size:11.5px;position:relative;min-height:170px;box-shadow:0 4px 0 #8fc2e3,0 10px 20px rgba(29,63,115,.15);}
.ktp h4{margin:0 0 6px;text-align:center;font-size:11px;letter-spacing:.06em;}
.ktp .row{display:grid;grid-template-columns:86px 8px 1fr;}
.ktp .ph{position:absolute;right:10px;bottom:10px;border-radius:8px;overflow:hidden;background:#e23b3b;line-height:0;}
.ktp .rows{padding-right:86px;}
.tix{background:#fff;color:#10233d;border-radius:16px;padding:10px 12px;font-size:12px;position:relative;box-shadow:0 4px 0 var(--line-2),0 10px 20px rgba(29,63,115,.12);border-top:8px solid var(--accent);}
.tix .bk{font-family:var(--font-mono);font-weight:700;font-size:16px;}
.tix .kv dt{color:#5a6b80}
.tix .kv dd{color:#10233d}
.speech{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-size:13.5px;position:relative;font-weight:600;}
.speech::after{content:"";position:absolute;left:28px;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);}
.facecmp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.facecmp canvas{border-radius:16px;border:3px solid var(--line-2);}
.match{font-family:var(--font-mono);font-size:22px;font-weight:700;}
.board-mini{font-family:var(--font-mono);font-size:12px;background:#24508f;border-radius:14px;border:3px solid var(--navy);overflow:hidden;}
.board-mini .r{display:grid;grid-template-columns:44px 1fr 36px;gap:6px;padding:6px 8px;border-bottom:1px solid #2f5f9f;color:#ffe08a;}
.board-mini .r.gone{color:#86a3c9;text-decoration:line-through;}
.board-mini .r.sel{background:#ff8a2a;color:#fff;}
.board-mini .r.pick{cursor:pointer;}
.board-mini .r.pick:hover{background:#2f63ab;}
@media (max-width:900px){.l2{grid-template-columns:1fr;grid-auto-rows:min-content;overflow:auto;padding-top:96px}.l2 .col{overflow:visible}.l2 .col:nth-child(2){order:-1}.l3{padding-top:96px}}
/* ---------- Level 3 ---------- */
.l3{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 12px 12px;gap:10px;}
.route{display:flex;align-items:center;gap:0;padding:8px 14px;background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
.route .st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;flex:none;color:var(--navy);}
.route .st i{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line-2);}
.route .st.done i{background:var(--go);border-color:var(--go-2);}
.route .seg{flex:1;height:6px;background:var(--sunk);position:relative;margin-bottom:16px;border-radius:3px;}
.route .seg > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;}
.l3 .work{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;}
.l3 .work > .panel{width:min(960px,100%);}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.pcard{background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.pcard.done{opacity:.55;}
.pcard .acts{display:flex;flex-wrap:wrap;gap:6px;}
.pcard .acts .btn{flex:1 1 45%;font-size:12px;min-height:34px;padding:6px 8px;}
.opt{text-align:left;justify-content:flex-start;width:100%;font-weight:700;line-height:1.4;}
/* ---------- Level 4 ---------- */
.l4panel{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;box-shadow:0 -6px 20px rgba(29,63,115,.1);}
.lv-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

function makeTitleScene() {

  scene.add(MK.box(68.4, .12, .4, 0xffd36b, 0, 5.05, 4.2, { r: .06 }));
  for (let i = -26; i <= 26; i += 10) scene.add(MK.bench(i + 3, 7.8, Math.PI));
  const s2 = MK.sign('NUSANTARA', 7, 1.4, { w: 640, h: 128 }); s2.position.set(-6, 3.2, 8.78); scene.add(s2);
  [[-6 - 3, 8.8], [-6 + 3, 8.8]].forEach(([x, z]) => scene.add(MK.cyl(.1, .1, 3, 0x3a4c66, x, 1.4, z)));
  for (let i = -30; i <= 30; i += 15) scene.add(MK.bush(i + 7, 9.2, 1));
  const bld = MK.box(30, 6, 8, 0xe9e1cf, 4, 3, -15, { r: .5 }); scene.add(bld);
  for (let x = -8; x <= 16; x += 4) scene.add(MK.box(2, 2.6, .3, 0x5aa9f0, x, 3.2, -10.95, { r: .3 }));
  const roof = MK.mesh(new THREE.CylinderGeometry(0, 6.2, 3, 4), 0x9b3b2c); roof.scale.set(3.2, 1, 1.05); roof.rotation.y = Math.PI / 4; roof.position.set(4, 7.5, -15); scene.add(roof);
  for (let i = 0; i < 34; i++) { const x = rand(-120, 120), z = rand(-50, -22); scene.add(Math.random() < .4 ? MK.palm(x, z, rand(1, 1.5)) : MK.tree(x, z, rand(1.1, 1.9))); }
  for (let i = 0; i < 14; i++) { const x = rand(-120, 120), z = rand(24, 50); scene.add(chance(.7) ? MK.tree(x, z, rand(1, 1.6)) : MK.bush(x, z, 1.5)); }
  MK.hills(scene, 9, -95, 320); MK.clouds(scene, 12);
  const people = [];
  for (let i = 0; i < 9; i++) { const p = MK.person({ shirt: pick([0xe25d4f, 0x3f8fd8, 0xf2c14e, 0x6bbf72, 0xffffff, 0x8e5bd6]), hijab: chance(.35) ? pick([0xeeeeee, 0x2b3a67, 0xc9566e]) : null }); p.position.set(rand(-25, 25), .9, rand(5, 8)); p.rotation.y = Math.PI + rand(-.6, .6); scene.add(p); people.push(p); }
  const tr = MK.train(5, { labels: ['EKS-1', 'EKS-2', 'BIS-1', 'MAKAN'] }); tr.position.set(-160, 0, 0); tr.rotation.y = 0; scene.add(tr);
  const tr2 = MK.train(6, { body: 0xffffff, stripe: 0x3a8ef6, stripe2: 0xff8a2a }); tr2.position.set(200, 0, -5.5); tr2.rotation.y = Math.PI; scene.add(tr2);
  let t = 0, phase = 0, wait = 0;
  return {
    scene, camera,
    update(dt) {
      t += dt;
      camera.position.set(Math.sin(t * .05) * 30 + 6, 13 + Math.sin(t * .1) * 2, 34);
      camera.lookAt(0, 2, 0);
      if (phase === 0) { tr.position.x += Math.max(2, (20 - tr.position.x) * .5) * dt * (tr.position.x > 0 ? .6 : 1); if (tr.position.x > 18) { phase = 1; wait = 6; } }
      else if (phase === 1) { wait -= dt; if (wait < 0) phase = 2; }
      else { tr.position.x += Math.min(30, (tr.position.x - 16) * .6 + 1) * dt; if (tr.position.x > 220) { tr.position.x = -160; phase = 0; } }
      tr2.position.x -= 22 * dt; if (tr2.position.x < -240) tr2.position.x = 240;

    },
  };
}

  }

  turnProgress() {

    const e = $('#h-task'); if (e) e.textContent = `${this.stats.turnDone}/${this.stats.turnTotal}`;

  },
  updateTurn(dt) {

  },
  finish() {
    const s = this.stats;
    const avg = s.cleanSum / Math.max(1, s.cleanN);
    const cleanScore = clamp((avg - 40) / 50 * 100, 0, 100);
    const safety = Math.max(0, 100 - s.slips * 35);
    const turn = clamp(s.turnDone / s.turnTotal * 100 + (s.turnDone === s.turnTotal ? s.turnLeft / 90 * 15 : 0), 0, 100);
    const tool = Math.max(0, 100 - s.wrong * 10);
    const prep = s.prepScore - (this.stock.apd ? 0 : 0);
    const team = s.cleaned + s.helperCleaned, share = team ? s.cleaned / team : 1;
    const contrib = clamp(share / .35 * 100, 0, 100);
    const total = prep * .10 + cleanScore * .30 + safety * .20 + turn * .25 + contrib * .10 + tool * .05;
    const notes = [];
    if (s.prepScore < 80) notes.push('Persiapan troli belum lengkap atau terlalu lama. Cek semua bahan sebelum shift.');
    if (avg < 90) notes.push(`Kebersihan rata-rata ${pct(avg)} masih di bawah target 90%. Prioritaskan genangan dan toilet karena bobotnya paling berat.`);
    if (s.slips) notes.push(`${s.slips} penumpang terpeleset. Pasang rambu lantai basah lebih dulu bila genangan jauh dari posisi Anda.`);
    if (s.turnDone < s.turnTotal) notes.push(`Turnaround hanya ${s.turnDone} dari ${s.turnTotal} tugas. Kelompokkan tugas per alat agar tidak sering berganti.`);
    if (s.wrong) notes.push(`${s.wrong} kali memakai alat yang salah.`);
    if (s.helpersCalled) notes.push(`Anda memanggil ${s.helpersCalled} rekan OB; tim membersihkan ${s.helperCleaned} kotoran, Anda sendiri ${s.cleaned}.${share < .35 ? ' Kontribusi pribadi di bawah 35%: tetap ikut bekerja, jangan hanya mengandalkan rekan.' : ''}`);
    else if (avg < 90) notes.push('Saat stasiun padat, tukarkan poin ⭐ untuk memanggil rekan OB agar kebersihan terkejar.');
    if (s.restocks) notes.push(`Kembali ke Ruang Janitor ${s.restocks} kali untuk isi ulang.`);
    Game.finish(1, {
      score: total, notes,
      rows: [
        ['Persiapan alat', 10, `${Math.round(s.prepTime)} dtk`, 'lengkap ≤ 25 dtk', prep],
        ['Kebersihan area (tim)', 30, pct(avg), '≥ 90%', cleanScore],
        ['Keselamatan penumpang', 20, `${s.slips} terpeleset`, '0 insiden', safety],
        ['Turnaround gerbong', 25, `${s.turnDone}/${s.turnTotal} tugas`, '100%', turn],
        ['Kontribusi pribadi', 10, `${Math.round(share * 100)}% · ${s.coinsEarned} ⭐`, '≥ 35%', contrib],
        ['Ketepatan alat', 5, `${s.wrong} salah`, '0', tool],
      ],
    });
  },
};

  buildTimetable() {
    const names = shuffle(L2_TRAIN_NAMES.slice());

    for (let i = 0; i < 10; i++) {

      this.trains.push({ no: 'KA ' + (100 + i * 7 + randi(0, 6)), name: names[i], dest, dep: t, jalur: randi(1, 4), kelas, seats, price, delay: 0 });

    this.annSched = list.map(t => ({ at: t.dep - 8, train: t, jenis: 'Kedatangan' }));

  /* ---------- customers ---------- */
  newCustomer() {
    const roll = Math.random();

    const p = makePerson(); const c = { type, p, live: p.face, arrived: this.min, err: null, scanned: null };
    const future = this.trains.filter(t => t.dep > this.min + 12);
    if (type === 'goshow') {
      // pick a request that has an answer
      for (let k = 0; k < 30; k++) {
        const t = pick(future.length ? future : this.trains), kelas = pick(t.kelas);
        const after = chance(.35) ? Math.ceil((this.min + randi(15, 50)) / 30) * 30 : null;
        const ans = this.goshowAnswer(t.dest, kelas, after);
        if (ans) { c.req = { dest: t.dest, kelas, after }; break; }
      }
      if (!c.req) c.type = 'verif';
    }
    if (c.type !== 'goshow') {
      const t = pick(future.length ? future : this.trains), kelas = pick(t.kelas);

        const opts = ['nama', 'nik', 'tanggal', 'wajah', 'berangkat'];
        const past = this.trains.filter(t => t.dep < this.min - 3);
        let e = pick(opts); if (e === 'berangkat' && !past.length) e = 'tanggal';

      if (v.target === 'stop') v.speed = 0;
      if (v.target === 'run' && plat.visible) { plat.position.x -= v.speed * dt; if (plat.position.x < -160) plat.visible = false; }
      props.forEach(p => { p.position.x -= v.speed * dt; if (p.position.x < -200) p.position.x += 400; });
      camera.position.set(-14 + Math.sin(v.t * .1) * 5, 15, 48); camera.lookAt(4, 1, 0);
    },
    arrive(name) { v.setStation(name); plat.visible = true; v.dist = Math.max(30, v.speed * v.speed / (2 * 3.4)); plat.position.x = v.dist; v.target = 'arrive'; },
  };
  return v;
}

/* ================= LEVEL 4 · PPKA (sinyal & wesel) ================= */
const L4G = (() => {
  const Y1 = 150, Y2 = 230, Y3 = 310;
  const P = {
    1: [[-60, Y2], [150, Y2], [230, Y1], [770, Y1], [850, Y2], [1060, Y2]],
    2: [[-60, Y2], [150, Y2], [190, Y2], [810, Y2], [850, Y2], [1060, Y2]],
    3: [[-60, Y2], [150, Y2], [190, Y2], [270, Y3], [730, Y3], [810, Y2], [850, Y2], [1060, Y2]],
  };
  const SEG = {
    LW: [[-60, Y2], [150, Y2]], SW1: [[150, Y2], [230, Y1]], W12: [[150, Y2], [190, Y2]], SW2: [[190, Y2], [270, Y3]],
    J1: [[230, Y1], [770, Y1]], J2: [[190, Y2], [810, Y2]], J3: [[270, Y3], [730, Y3]],
    SE2: [[730, Y3], [810, Y2]], E21: [[810, Y2], [850, Y2]], SE1: [[770, Y1], [850, Y2]], LE: [[850, Y2], [1060, Y2]],
  };
  const SW = { W1: { x: 150, y: Y2, side: 'W', rTrack: 1 }, W2: { x: 190, y: Y2, side: 'W', rTrack: 3 }, E2: { x: 810, y: Y2, side: 'E', rTrack: 3 }, E1: { x: 850, y: Y2, side: 'E', rTrack: 1 } };
  const build = pts => { const segs = []; let s = 0; for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const l = Math.hypot(x1 - x0, y1 - y0); segs.push({ x0, y0, x1, y1, s0: s, l }); s += l; } return { pts, segs, len: s }; };
  const paths = { 1: {}, '-1': {} };
  [1, 2, 3].forEach(k => { paths[1][k] = build(P[k]); paths[-1][k] = build(P[k].slice().reverse()); });
  const at = (path, s) => { s = clamp(s, 0, path.len); for (const g of path.segs) if (s <= g.s0 + g.l) { const t = (s - g.s0) / g.l; return [g.x0 + (g.x1 - g.x0) * t, g.y0 + (g.y1 - g.y0) * t]; } const g = path.segs[path.segs.length - 1]; return [g.x1, g.y1]; };
  const sAtX = (path, x) => { for (const g of path.segs) { const lo = Math.min(g.x0, g.x1), hi = Math.max(g.x0, g.x1); if (x >= lo && x <= hi && g.x1 !== g.x0) { return g.s0 + Math.abs(x - g.x0) / Math.abs(g.x1 - g.x0) * g.l; } } return null; };
  return { Y1, Y2, Y3, SEG, SW, paths, at, sAtX };
})();

    const T = L5_TIER[S.tier], sl = this.slots(S), occ = Math.round(sl * S.occ);
    let base = occ * T.rent * this.rentMult(S);
    if (this.own(S, 'vip')) base += Math.min(2, occ) * 10e6 * this.rentMult(S);
    return base * (S.tenantRelief ? .7 : 1);
  },
  salary(S) { return Object.entries(S.staff).reduce((a, [k, n]) => a + n * L5_STAFF[k].gaji, 0); },
  recMaint(S) { return L5_TIER[S.tier].maintBase + S.owned.reduce((a, k) => a + L5_FAC.find(f => f.id === k).cost * .008, 0); },
  thr(S) { return S.staff.tiket * 450 + (this.own(S, 'gate') ? 1500 : 0) + (this.own(S, 'face') ? 1000 : 0) + (S.tier === 3 ? 8000 : 0); },
  needPPKA(S) { return Math.max(1, S.tier - (this.own(S, 'ctc') ? 1 : 0)); },
  understaff(S) {
    const rec = L5_TIER[S.tier].rec; let miss = 0, tot = 0;
    for (const k in rec) { tot += rec[k]; miss += Math.max(0, rec[k] - S.staff[k]); }
    return miss / tot;
  },
  facCsat(S) { return S.owned.reduce((a, k) => a + (L5_FAC_CSAT[k] || 0), 0); },
  /* one simulated day; returns array of events */
  day(S) {
    const T = L5_TIER[S.tier], cap = this.cap(S), out = [];
    const peak = S.mudik.active;
    // demand
    const tgt = cap * clamp(.55 + .15 * (S.csat - 3), .35, 1.05);
    S.demand += (tgt - S.demand) * .07;
    const dow = (S.day + 2) % 7, weekend = dow === 5 || dow === 6;
    let mult = weekend ? 1.15 : 1; if (peak) mult *= S.mudik.prepared ? 2.1 : 2.3; if (S.fx.paxCut > 0) mult *= .4;
    const demand = S.demand * mult;
    const pax = Math.round(Math.min(demand, cap * (peak && S.mudik.prepared ? 1.6 : 1.1)));
    S.pax = pax;
    const thr = this.thr(S) * (peak && S.mudik.prepared ? 1.6 : 1);
    // condition
    S.cond = clamp(S.cond - 1.35 * (this.own(S, 'canopy') ? .85 : 1) + (S.maint / 100) * 1.15 + Math.min(S.staff.teknisi, T.rec.teknisi) / T.rec.teknisi * .45 - (peak ? .6 : 0), 0, 100);
    // clean
    const obCap = [0, 290, 560, 800][S.tier] * S.staff.ob * (.85 + S.morale / 500) * (this.own(S, 'food') ? .9 : 1) * (peak && S.mudik.prepared ? 1.5 : 1);
    const cleanT = 48 + 52 * Math.pow(Math.min(1, obCap / Math.max(1, pax)), 1.3) - Math.max(0, 60 - S.cond) * .4 + (S.plan === 'clean' ? 8 : 0);
    S.clean = clamp(S.clean + (cleanT - S.clean) * .3, 0, 100);
    // OTP
    const needP = this.needPPKA(S);
    let otpT = 98.4 - 5.5 * Math.max(0, needP - S.staff.ppka) - Math.max(0, 70 - S.cond) * .12 + (this.own(S, 'ctc') ? 1.4 : 0) + (S.morale - 70) * .02 + (S.plan === 'otp' ? 2 : 0) - Math.max(0, demand / thr - 1) * 2.5 - (peak && !S.mudik.prepared ? 6 : 0);
    let otp = clamp(otpT + rand(-1.4, 1.0), 30, 100);
    if (S.fx.otpCut > 0) { otp = Math.min(otp, 60); S.fx.otpCut--; }
    S.otp = otp;
    // CSAT
    const rec = T.rec;
    let csT = 3.3 + this.facCsat(S) + S.bonusCsat + (S.clean - 85) * .022 + (Math.min(1, thr / Math.max(1, demand)) - 1) * 1.8
      + Math.min(S.staff.cs, rec.cs) / rec.cs * .22 + Math.min(S.staff.polsuska, rec.polsuska) / rec.polsuska * .12 + (otp - 95) * .03
      - (demand > cap * 1.05 ? .25 : 0) + ({ rendah: .05, normal: 0, tinggi: -.15 }[S.parkir]) + (S.morale - 70) * .004 + (S.plan === 'csat' ? .2 : 0) - (S.tier === 1 ? .05 : 0);
    if (S.fx.csatCut > 0) { csT -= .7; S.fx.csatCut--; }
    S.csat = clamp(S.csat + (csT - S.csat) * .22, 1, 5);
    // morale
    const moT = 72 - 30 * this.understaff(S) + S.moraleMod - (peak && !S.mudik.prepared ? 10 : 0);
    S.morale = clamp(S.morale + (moT - S.morale) * .15, 10, 100);
    S.moraleMod *= .97;
    // accidents
    let p = .0012 + Math.max(0, 55 - S.cond) * .0018 + Math.max(0, needP - S.staff.ppka) * .02;
    if (this.own(S, 'sky')) p *= .5; if (S.cctv) p *= .85;
    if (Math.random() < p) { S.m.acc++; S.csat -= this.own(S, 'pos') ? .08 : .18; out.push({ k: 'acc', msg: pick(['Penumpang tertemper kereta saat menyeberang rel', 'Gangguan wesel menyebabkan kereta anjlok ringan di emplasemen', 'Penumpang jatuh di celah peron']) }); }
    // signal fault event
    let pf = .045 * (this.own(S, 'ctc') ? .4 : 1) * (S.cond < 60 ? 1.6 : 1);
    if (Math.random() < pf) out.push({ k: 'fault' });
    // money
    const revPax = pax * 2500;
    const pr = { rendah: [3000, 1.2], normal: [5000, 1], tinggi: [8000, .7] }[S.parkir];
    const revPark = pax * .14 * pr[0] * pr[1] * (this.own(S, 'parkir') ? 2.2 : 1);
    const revLounge = this.own(S, 'vip') ? pax * .006 * 50000 : 0;
    const revTen = this.tenantMonthly(S) / 30;
    const gaji = this.salary(S) / 30, maint = this.recMaint(S) * S.maint / 100 / 30;
    S.cash += revPax + revPark + revLounge + revTen - gaji - maint;
    const m = S.m;
    m.rev.pax += revPax; m.rev.parkir += revPark; m.rev.lounge += revLounge; m.rev.tenant += revTen; m.exp.gaji += gaji; m.exp.maint += maint;
    m.otp.push(otp); m.clean.push(S.clean); m.csat.push(S.csat); m.cond.push(S.cond); m.pax.push(pax);
    if (S.plan) { S.planDays--; if (S.planDays <= 0) S.plan = null; }
    if (S.fx.paxCut > 0) S.fx.paxCut--;
    return out;
  },
  avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0; },
  evaluate(S) {
    const m = S.m, T = L5_TIER[S.tier];

    const target = T.target * (S.monthsAtTier === 0 && S.tier > 1 ? .6 : 1);
    // pilar 1: operasional & keselamatan
    const otpS = otp >= 95 ? 100 : clamp(100 - (95 - otp) * 9, 0, 100);
    const accS = m.acc === 0 ? 100 : Math.max(0, 100 - 60 * m.acc);
    const fr = m.faults.length ? this.avg(m.faults.map(f => f == null ? 30 : f)) : 0;
    const sigS = m.faults.length ? clamp(100 - Math.max(0, fr - 3) * 7, 0, 100) : 100;
    const p1 = otpS * .55 + accS * .30 + sigS * .15;
    // pilar 2: kebersihan & fasilitas
    const clS = clean >= 90 ? 100 : clamp(100 - (90 - clean) * 4, 0, 100);
    const p2 = clamp(clS * .7 + cond * .3 - (m.inspect === false ? 10 : 0), 0, 100);
    // pilar 3: keuangan & komersial
    const finR = rev / target * 100;
    const effR = rev > 0 ? expOps / rev : 2;
    const effS = clamp(100 - Math.max(0, effR - .7) * 160, 0, 100);
    const p3 = clamp(Math.min(100, finR) * .6 + S.occ * 100 * .2 + effS * .2, 0, 100);
    // pilar 4: kepuasan
    const p4 = csat >= 4.2 ? 100 : clamp(100 - (4.2 - csat) * 70, 0, 100);
    let score = p1 * .35 + p2 * .25 + p3 * .20 + p4 * .20;
    let capped = false;
    if (S.mudik.failed && S.mudik.month === S.month) { score = Math.min(score, 59); capped = true; }
    return { otp, clean, csat, cond, rev, expOps, target, finR, effR, fr, p1, p2, p3, p4, score, grade: gradeOf(score), capped, otpS, accS, sigS, clS };
  },
};

const DAY_LEN = 5; // detik nyata per hari pada kecepatan 1x
const L5 = {
  id: 5,
  brief: {
    intro: 'Anda kini Kepala Stasiun Nusantara (Kelas III). Kelola kas, staf, fasilitas, dan kepuasan penumpang. Setiap akhir bulan auditor Daop menilai kinerja Anda. Masa jabatan: 12 bulan.',
    sop: [
      '<b>Arus pendapatan:</b> komisi per penumpang (pass-through fee), sewa tenant, parkir & drop-off, serta subsidi/bonus Daop bila OTP ≥ 95% dan kebersihan ≥ 90%.',
      '<b>Upgrade:</b> naik kelas ke Stasiun Kelas II (kapasitas 3.000/hari), lalu Stasiun Utama (&gt; 15.000/hari). Syarat: evaluasi terakhir minimal Grade B dan semua fasilitas tier saat ini sudah dibangun. Grade A memberi akselerasi (diskon 30%).',
      '<b>Krisis:</b> banjir rel (Rp 15 jt, OB &amp; PPKA, SLA 5 menit), blackout (Rp 8 jt, Teknisi &amp; Polsuska, SLA 1 menit), mudik Lebaran (Rp 25 jt, seluruh staf, peak season di bulan ke-3).',
      '<b>Evaluasi Daop:</b> Operasional &amp; Keselamatan 35%, Kebersihan &amp; Fasilitas 25%, Keuangan &amp; Komersial 20%, Kepuasan Penumpang 20%.',
      '<b>Grade D</b> berarti audit khusus dan demosi. Grade C memberi SP 1 dan wajib action plan 3 hari.',
    ],
    controls: ['Atur kecepatan waktu di bilah atas (jeda, 1×, 2×, 4×). Satu hari = 5 detik pada 1×.', 'Panel kanan: Ringkasan, Fasilitas, Staf, Keuangan, Laporan.', 'Saat krisis, waktu berjalan 1× dan jam SLA berjalan 6× lebih cepat dari waktu nyata.'],
    kpi: [['Operasional & Keselamatan', '35%'], ['Kebersihan & Fasilitas', '25%'], ['Keuangan & Komersial', '20%'], ['Kepuasan Penumpang', '20%']],
  },
  start() {
    Game.setCanvas(GL.ok ? 'gl' : 'none');
    this.v = null;
    if (GL.ok) { this.v = makeTycoonScene(); GL.use(this.v); }
    const snap = Save.data.l5;
    if (snap && snap.S && !snap.S.ended) {
      this.modalPause = true;
      UI.modal({ title: 'Masa jabatan tersimpan', html: `<p>Anda punya masa jabatan yang belum selesai: <b>Bulan ${snap.S.month}</b>, ${L5_TIER[snap.S.tier].name}, kas ${rpShort(snap.S.cash)}.</p>`, buttons: [
        { label: `Lanjutkan bulan ${snap.S.month}`, cls: 'primary', onClick: () => this.begin(JSON.parse(JSON.stringify(snap.S))) },
        { label: 'Mulai masa jabatan baru', onClick: () => this.begin(null) }] });
    } else this.begin(null);
  },
  begin(S) {
    this.modalPause = false;
    if (!S) { S = L5Sim.fresh(); L5Sim.newMonth(S); S.log = []; }
    this.S = S; this.speed = 1; this.acc = 0; this.tab = this.tab || 'sum'; this.crisis = null; this.fault = null; this.minimized = false;
    this.snapshot();
    if (this.v) { this.v.rebuild(S); this.v.setPeople(S.demand / 60); }
    this.renderHud();
    if (S.month === 1 && S.day === 1) this.addLog('Hari pertama sebagai Kepala Stasiun. Tinjau staf dan anggaran perawatan.', 'good');
  },
  snapshot() { const c = JSON.parse(JSON.stringify(this.S)); Save.data.l5 = { S: c }; Save.write(); },
  cleanup() { this.v = null; },
  addLog(m, k = '') {
    const S = this.S; S.log.unshift({ m, k, d: `B${S.month}·H${S.day}` }); S.log = S.log.slice(0, 40);
    if (this.tab === 'sum') this.renderTab();
  },
  /* ---------- HUD ---------- */
  renderHud() {
    UI.setHud(`<div class="topbar" id="top5"></div>
      <div class="l5side" id="side5"><div class="panel" style="display:flex;flex-direction:column;gap:8px;flex:1;min-height:0">
        <div class="btnrow" style="justify-content:space-between;align-items:center"><div class="tabs" id="tabs5"></div><button class="btn sm mobile-toggle" id="b-min">${this.minimized ? 'Buka panel' : 'Kecilkan'}</button></div>
        <div class="body" id="tab5"></div></div></div>`);
    $('#b-min').onclick = () => { this.minimized = !this.minimized; $('#side5').classList.toggle('min', this.minimized); $('#b-min').textContent = this.minimized ? 'Buka panel' : 'Kecilkan'; };
    $('#side5').classList.toggle('min', this.minimized);
    const tabs = [['sum', 'Ringkasan'], ['fac', 'Fasilitas'], ['staff', 'Staf'], ['fin', 'Keuangan'], ['rep', 'Laporan']];
    $('#tabs5').innerHTML = tabs.map(([k, l]) => `<button class="tab ${this.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
    $$('[data-tab]').forEach(b => b.onclick = () => { this.tab = b.dataset.tab; $$('[data-tab]').forEach(x => x.classList.toggle('on', x === b)); this.renderTab(); });
    this.renderTop(); this.renderTab();
  },
  renderTop() {
    const S = this.S, el = $('#top5'); if (!el) return;
    const chipC = (v, good, warn) => v >= good ? 'good' : v >= warn ? 'warn' : 'bad';
    if (!el.dataset.built) {
      el.dataset.built = 1;
      el.innerHTML = `<span class="chip title">Level 5 · Kepala Stasiun</span><span class="chip">Kas <b id="t5-cash"></b></span><span class="chip"><b id="t5-date"></b></span><span class="chip" id="t5-tier"></span>
        <span class="chip">Penumpang <b id="t5-pax"></b></span><span class="chip" id="t5-otp-c">OTP <b id="t5-otp"></b></span><span class="chip" id="t5-cl-c">Bersih <b id="t5-cl"></b></span><span class="chip" id="t5-cs-c">CSAT <b id="t5-cs"></b></span>
        <span id="t5-alert"></span><span class="spacer"></span>
        <span class="btnrow speed" style="gap:4px">${[0, 1, 2, 4].map(s => `<button class="btn sm" data-sp="${s}">${s ? s + '×' : '❚❚'}</button>`).join('')}</span><button class="btn sm" id="b-pause">Menu</button>`;
      $$('[data-sp]').forEach(b => b.onclick = () => { if (this.crisis && +b.dataset.sp !== 1) { UI.toast('Saat krisis, waktu berjalan normal (1×).', 'warn'); return; } this.speed = +b.dataset.sp; this.renderTop(); });
      $('#b-pause').onclick = () => Game.pauseMenu();
    }
    $('#t5-cash').textContent = rpShort(S.cash); $('#t5-cash').style.color = S.cash < 0 ? 'var(--stop-ink)' : '';
    $('#t5-date').textContent = `Bulan ${S.month} · Hari ${S.day}/30`;
    $('#t5-tier').textContent = L5_TIER[S.tier].name;
    $('#t5-pax').textContent = (S.pax || Math.round(S.demand)).toLocaleString('id-ID') + '/hari';
    $('#t5-otp').textContent = S.otp.toFixed(1) + '%'; $('#t5-otp-c').className = 'chip ' + chipC(S.otp, 95, 90);
    $('#t5-cl').textContent = Math.round(S.clean) + '%'; $('#t5-cl-c').className = 'chip ' + chipC(S.clean, 90, 80);
    $('#t5-cs').textContent = S.csat.toFixed(2); $('#t5-cs-c').className = 'chip ' + chipC(S.csat, 4.2, 3.8);
    $$('[data-sp]').forEach(b => b.classList.toggle('on', +b.dataset.sp === this.speed));
    const al = $('#t5-alert');
    if (this.fault) {
      if (!al.dataset.f) { al.dataset.f = 1; al.innerHTML = `<button class="btn sm stop" id="b-fault">Gangguan sinyal · kirim teknisi <b class="mono" id="f-left"></b></button>`; $('#b-fault').onclick = () => this.fixFault(); }
      $('#f-left').textContent = Math.ceil(this.fault.left) + 's';
    } else if (al.dataset.f) { al.dataset.f = ''; al.innerHTML = ''; }
  },
  renderTab() {
    const el = $('#tab5'); if (!el) return;
    const S = this.S, T = L5_TIER[S.tier], m = S.m, avg = L5Sim.avg;
    if (this.tab === 'sum') {
      const live = S.m.otp.length ? L5Sim.evaluate(S) : null;
      const mud = S.mudik;
      let alert = '';
      if (S.month === mud.month && S.day >= 13 && !mud.prepared && !mud.failed && S.day < 20) {
        const rec = T.rec, ok = Object.keys(rec).every(k => S.staff[k] >= rec[k]);
        alert = `<div class="panel" style="border-color:var(--stop);padding:10px"><div class="eyebrow" style="color:var(--stop-ink)">Krisis terjadwal · ${L5_CRISIS.mudik.name}</div><p style="font-size:12.5px;margin:4px 0 8px">Peak season mulai Hari 20 (H-${20 - S.day}). Siapkan Posko Angkutan Lebaran: biaya Rp 25.000.000 dan seluruh staf minimal sesuai rekomendasi. Jika gagal: <b>${L5_CRISIS.mudik.fail}</b>.</p>
          <div style="font-size:12px;margin-bottom:8px">${Object.keys(rec).map(k => `<span class="tag ${S.staff[k] >= rec[k] ? 'go' : 'stop'}" style="margin:2px">${L5_STAFF[k].name} ${S.staff[k]}/${rec[k]}</span>`).join('')}</div>
          <button class="btn sm primary" id="b-mudik" ${ok && S.cash >= 25e6 ? '' : 'disabled'}>Siapkan Posko (Rp 25 jt)</button></div>`;
      } else if (mud.prepared && S.month === mud.month) alert = `<div class="panel" style="border-color:var(--go);padding:10px;font-size:12.5px"><b>Posko Angkutan Lebaran siap.</b> ${mud.active ? 'Peak season sedang berlangsung.' : ''}</div>`;
      const row = (lbl, val, tgt, ok) => `<div class="kpi-row"><span>${lbl}<br><span class="muted" style="font-size:11px">target ${tgt}</span></span><span class="tag ${ok ? 'go' : 'stop'} mono" style="text-align:center">${val}</span></div>`;
      el.innerHTML = `${alert}<div class="eyebrow" style="margin-top:6px">KPI bulan berjalan (rata-rata)</div>
        <div style="display:grid;gap:8px;margin-top:8px">
        ${row('OTP (ketepatan waktu)', m.otp.length ? avg(m.otp).toFixed(1) + '%' : '–', '≥ 95%', !m.otp.length || avg(m.otp) >= 95)}
        ${row('Insiden keselamatan', m.acc, '0', m.acc === 0)}
        ${row('Kebersihan', m.clean.length ? Math.round(avg(m.clean)) + '%' : '–', '≥ 90%', !m.clean.length || avg(m.clean) >= 90)}
        ${row('Kondisi fasilitas', Math.round(S.cond) + '%', '≥ 70%', S.cond >= 70)}
        ${row('CSAT', m.csat.length ? avg(m.csat).toFixed(2) : '–', '≥ 4,2', !m.csat.length || avg(m.csat) >= 4.2)}
        ${row('Pendapatan vs target', live ? pct(live.finR) : '–', '≥ 100% di akhir bulan', !live || live.finR >= S.day / 30 * 100 * .95)}
        ${row('Moral staf', Math.round(S.morale), '≥ 65', S.morale >= 65)}
        </div>
        ${live ? `<p class="muted" style="font-size:12px;margin-top:8px">Proyeksi skor: <b class="mono">${Math.round(live.score)}</b> ${gradeBadge(live.grade)}</p>` : ''}
        ${this.hints()}
        <div class="eyebrow" style="margin-top:10px">Log stasiun</div><div class="log" style="margin-top:6px">${S.log.slice(0, 12).map(l => `<div class="${l.k}"><span class="mono muted">${l.d}</span> ${l.m}</div>`).join('')}</div>`;
      const bm = $('#b-mudik'); if (bm) bm.onclick = () => this.prepMudik();
    }
    if (this.tab === 'fac') {
      const next = L5_TIER[S.tier + 1];
      const curAll = L5_FAC.filter(f => f.tier === S.tier).every(f => S.owned.includes(f.id));
      const gradeOK = S.monthsAtTier >= 1 && (S.lastGrade === 'A' || S.lastGrade === 'B');
      const upCost = next ? next.upCost * (S.accel ? .7 : 1) : 0;
      el.innerHTML = `<div class="eyebrow">Kelas stasiun saat ini</div><p style="margin:4px 0 10px"><b>${T.name}</b> · kapasitas ${T.cap.toLocaleString('id-ID')} penumpang/hari</p>
        ${next ? `<div class="fac"><div><b>Naik kelas: ${next.name}</b></div><button class="btn sm primary" id="b-up" data-cost="${upCost}" ${curAll && gradeOK && S.cash >= upCost ? '' : 'disabled'}>${rpShort(upCost)}</button>
          <small>Kapasitas ${next.cap.toLocaleString('id-ID')}/hari. Syarat: ${S.tier === 1 ? '' : `semua fasilitas Tier ${S.tier} (${curAll ? '✓' : '✗'}), `}evaluasi terakhir Grade A/B di kelas ini (${gradeOK ? '✓' : '✗'})${S.accel ? ' · akselerasi Grade A: diskon 30%' : ''}.</small></div>` : '<p class="tag go">Kelas tertinggi tercapai.</p>'}
        <div class="eyebrow" style="margin-top:12px">Fasilitas Tier 1 (sudah tersedia)</div><p class="muted" style="font-size:12.5px;margin-top:4px">Bangunan ${S.tier === 1 ? 'kayu sederhana' : 'baru'}, peron, kursi ${S.tier === 1 ? 'kayu' : 'tunggu'}, loket manual, toilet dasar.</p>
        ${[2, 3].map(t => `<div class="eyebrow" style="margin-top:12px">Fasilitas Tier ${t} ${S.tier < t ? '· terkunci' : ''}</div><div style="display:grid;gap:8px;margin-top:6px">${L5_FAC.filter(f => f.tier === t).map(f => {
          const owned = S.owned.includes(f.id), lockR = f.req && !S.owned.includes(f.req), can = S.tier >= t && !owned && !lockR && S.cash >= f.cost;
          return `<div class="fac ${owned ? 'owned' : ''}"><b>${f.name}</b>${owned ? '<span class="tag go">Dibangun</span>' : `<button class="btn sm" data-buy="${f.id}" data-cost="${f.cost}" ${can ? '' : 'disabled'}>${rpShort(f.cost)}</button>`}<small>${f.desc}${lockR ? ' Butuh Gate E-Ticket.' : ''}</small></div>`;
        }).join('')}</div>`).join('')}`;
      const up = $('#b-up'); if (up) up.onclick = () => this.upgrade();
      $$('[data-buy]').forEach(b => b.onclick = () => this.buy(b.dataset.buy));
    }
    if (this.tab === 'staff') {
      const rec = T.rec;
      el.innerHTML = `<p class="muted" style="font-size:12.5px">Rekrut: biaya sekali 50% gaji. Pemutusan: pesangon 1× gaji dan moral turun. Kekurangan staf menurunkan moral dan KPI.</p>
        <div class="staff" style="font-size:11px;color:var(--muted)"><span>Peran</span><span>Jumlah</span><span></span><span>Rek.</span></div>
        ${Object.entries(L5_STAFF).map(([k, s]) => `<div class="staff"><div><b>${s.name}</b><div class="muted" style="font-size:11.5px">${s.peran} · ${rpShort(s.gaji)}/bln</div></div>
          <span class="btnrow" style="gap:4px"><button class="btn sm" data-fire="${k}" ${S.staff[k] ? '' : 'disabled'}>−</button><span class="n" id="sn-${k}">${S.staff[k]}</span><button class="btn sm" data-hire="${k}">+</button></span><span></span><span class="tag ${S.staff[k] >= rec[k] ? 'go' : 'warn'} mono">${rec[k]}</span></div>`).join('')}
        <p style="margin-top:10px;font-size:13px">Total gaji: <b class="mono">${rpShort(L5Sim.salary(S))}</b>/bulan · Moral staf <b class="mono">${Math.round(S.morale)}</b></p>`;
      $$('[data-hire]').forEach(b => b.onclick = () => this.hire(b.dataset.hire, 1));
      $$('[data-fire]').forEach(b => b.onclick = () => this.hire(b.dataset.fire, -1));
    }
    if (this.tab === 'fin') {
      const rec = L5Sim.recMaint(S), rev = m.rev, ex = m.exp;
      const opt = (id, val, lbl) => `<div class="field"><label for="${id}">${lbl}</label><select id="${id}" class="inp">${['rendah', 'normal', 'tinggi'].map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o[0].toUpperCase() + o.slice(1)}</option>`).join('')}</select></div>`;
      const totR = rev.pax + rev.tenant + rev.parkir + rev.lounge + rev.daop, totE = ex.gaji + ex.maint + ex.krisis + ex.investasi + ex.rekrut + ex.lain;
      el.innerHTML = `<div class="field"><label for="mt">Anggaran perawatan: <span id="mtv">${S.maint}%</span> dari rekomendasi (${rpShort(rec)}/bln)</label><input type="range" id="mt" min="0" max="150" step="10" value="${S.maint}"></div>
        <div class="grid2" style="margin-top:8px">${opt('rent', S.rent, 'Tarif sewa tenant')}${opt('park', S.parkir, 'Tarif parkir')}</div>
        <p class="muted" style="font-size:12px;margin-top:6px">Okupansi tenant: <b>${Math.round(S.occ * 100)}%</b> dari ${L5Sim.slots(S)} slot · sewa tinggi menurunkan okupansi, parkir mahal menurunkan CSAT.</p>
        <div class="eyebrow" style="margin-top:12px">Laba rugi bulan ${S.month} (berjalan)</div>
        <div class="tbl-wrap"><table class="t" style="min-width:0;margin-top:6px">
        <tr><td>Passenger pass-through fee</td><td class="num">${rpShort(rev.pax)}</td></tr><tr><td>Sewa tenant & retail</td><td class="num">${rpShort(rev.tenant)}</td></tr><tr><td>Parkir & drop-off</td><td class="num">${rpShort(rev.parkir)}</td></tr>${rev.lounge ? `<tr><td>VIP lounge</td><td class="num">${rpShort(rev.lounge)}</td></tr>` : ''}
        <tr><th>Total pendapatan</th><th class="num">${rpShort(totR)}</th></tr>
        <tr><td>Gaji staf</td><td class="num">${rpShort(-ex.gaji)}</td></tr><tr><td>Perawatan</td><td class="num">${rpShort(-ex.maint)}</td></tr><tr><td>Penanganan krisis</td><td class="num">${rpShort(-ex.krisis)}</td></tr><tr><td>Rekrutmen & lain-lain</td><td class="num">${rpShort(-(ex.rekrut + ex.lain))}</td></tr><tr><td>Investasi fasilitas</td><td class="num">${rpShort(-ex.investasi)}</td></tr>
        <tr><th>Arus kas bersih</th><th class="num">${rpShort(totR - totE)}</th></tr></table></div>
        <p class="muted" style="font-size:12px;margin-top:6px">Target pendapatan Daop bulan ini: <b>${rpShort(T.target * (S.monthsAtTier === 0 && S.tier > 1 ? .6 : 1))}</b>${S.monthsAtTier === 0 && S.tier > 1 ? ' (masa transisi 60%)' : ''}.</p>`;
      $('#mt').oninput = e => { S.maint = +e.target.value; $('#mtv').textContent = S.maint + '%'; };
      $('#rent').onchange = e => { S.rent = e.target.value; L5Sim.updOcc(S); this.renderTab(); };
      $('#park').onchange = e => { S.parkir = e.target.value; };
    }
    if (this.tab === 'rep') {
      el.innerHTML = S.history.length ? `<div class="tbl-wrap"><table class="t" style="min-width:0"><tr><th>Bulan</th><th>Kelas</th><th>Skor</th><th>Grade</th><th>Pendapatan</th></tr>${S.history.map(h => `<tr><td>${h.month}</td><td>${h.tier}</td><td class="num">${h.score}</td><td>${gradeBadge(h.grade)}</td><td class="num">${rpShort(h.rev)}</td></tr>`).join('')}</table></div>
        <div style="margin-top:12px;display:flex;align-items:flex-end;gap:6px;height:120px">${S.history.map(h => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><span class="mono" style="font-size:10px">${h.score}</span><i style="display:block;width:100%;height:${h.score}px;border-radius:3px 3px 0 0;background:${h.grade === 'A' ? 'var(--go)' : h.grade === 'B' ? 'var(--info)' : h.grade === 'C' ? 'var(--warn)' : 'var(--stop)'}"></i><span class="mono muted" style="font-size:10px">B${h.month}</span></div>`).join('')}</div>`
        : '<p class="muted">Belum ada evaluasi bulanan. Laporan pertama terbit di akhir Bulan 1.</p>';
    }
  },
  refreshButtons() {
    const S = this.S;
    $$('[data-buy]').forEach(b => { const f = L5_FAC.find(x => x.id === b.dataset.buy); b.disabled = !(S.tier >= f.tier && !(f.req && !S.owned.includes(f.req)) && S.cash >= f.cost); });
  },
  hints() {
    const S = this.S, rec = L5_TIER[S.tier].rec, h = [];
    const low = Object.keys(rec).filter(k => S.staff[k] < rec[k]);
    if (low.length) h.push(`Kekurangan staf: ${low.map(k => L5_STAFF[k].name).join(', ')}.`);
    if (S.cond < 65) h.push('Kondisi fasilitas menurun. Naikkan anggaran perawatan atau tambah teknisi.');
    if (L5Sim.thr(S) < S.demand) h.push('Antrean loket melebihi kapasitas layanan. Tambah petugas ticketing atau bangun Gate E-Ticket.');
    if (S.cash < 20e6) h.push('Kas menipis. Krisis butuh dana Rp 8–25 juta.');
    return h.length ? `<div class="panel" style="margin-top:10px;padding:10px;font-size:12.5px;border-color:#f7d98a"><div class="eyebrow" style="color:var(--warn)">Saran staf ahli</div><ul class="sop" style="margin-top:4px;gap:4px">${h.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
  },
  /* ---------- actions ---------- */
  spend(amount, cat) { this.S.cash -= amount; this.S.m.exp[cat] += amount; },
  buy(id) {
    const S = this.S, f = L5_FAC.find(x => x.id === id);
    if (S.cash < f.cost) return;
    this.spend(f.cost, 'investasi'); S.owned.push(id); Sfx.cash();
    this.addLog(`Fasilitas dibangun: ${f.name}.`, 'good'); UI.toast(`${f.name} selesai dibangun.`, 'good');
    if (id === 'food' || id === 'vip') L5Sim.updOcc(S);
    if (this.v) this.v.rebuild(S);
    this.renderTab(); this.renderTop();
  },
  upgrade() {
    const S = this.S, next = L5_TIER[S.tier + 1]; if (!next) return;
    const cost = next.upCost * (S.accel ? .7 : 1);
    if (S.cash < cost) return;
    this.spend(cost, 'investasi'); S.tier++; S.monthsAtTier = 0; S.accel = false; S.demand = Math.max(S.demand, next.cap * .4);
    Sfx.promo(); this.addLog(`Stasiun naik kelas menjadi ${next.name}!`, 'good');
    UI.modal({ title: `Selamat! ${next.name}`, html: `<p>Kapasitas naik menjadi ${next.cap.toLocaleString('id-ID')} penumpang/hari. Rekomendasi staf dan target pendapatan Daop ikut naik; bulan pertama di kelas baru adalah masa transisi (target 60%).</p><p class="muted" style="margin-top:8px">Rekrut staf sesuai rekomendasi agar KPI tetap terjaga.</p>`, buttons: [{ label: 'Lihat staf', cls: 'primary', onClick: () => { this.tab = 'staff'; this.renderHud(); } }, { label: 'Tutup' }] });
    if (this.v) this.v.rebuild(S);
    this.renderTab(); this.renderTop();
  },
  hire(k, d) {
    const S = this.S, g = L5_STAFF[k].gaji;
    if (d > 0) { this.spend(g * .5, 'rekrut'); S.staff[k]++; Sfx.click(); }
    else { if (!S.staff[k]) return; this.spend(g, 'lain'); S.staff[k]--; S.moraleMod -= 3; Sfx.click(); }
    if (this.tab === 'staff') this.renderTab();
    if (this.crisis) this.renderCrisis();
    this.renderTop();
  },
  prepMudik() {
    const S = this.S; if (S.cash < 25e6) return;
    this.spend(25e6, 'krisis'); S.mudik.prepared = true; Sfx.ok();
    this.addLog('Posko Angkutan Lebaran siap. Seluruh staf disiagakan.', 'good'); UI.toast('Posko Angkutan Lebaran siap.', 'good'); this.renderTab();
  },
  fixFault() {
    const S = this.S, f = this.fault; if (!f) return;
    if (!S.staff.teknisi) { UI.toast('Tidak ada teknisi. Rekrut teknisi di tab Staf.', 'bad'); return; }
    S.m.faults.push(f.t); this.fault = null; Sfx.ok(); this.addLog(`Gangguan sinyal ditangani dalam ${f.t.toFixed(1)} detik.`, f.t <= 3 ? 'good' : 'warn'); this.renderTop();
  },
  /* ---------- crises ---------- */
  startCrisis(k) {
    if (this.crisis) return;
    const C = L5_CRISIS[k];
    this.crisis = { k, left: C.sla / 6, total: C.sla / 6 };
    this.speed = 1; Sfx.alarm(); if (this.v) this.v.crisis(k);
    this.addLog(`KRISIS: ${C.name}!`, 'bad');
    this.renderCrisis(); this.renderTop();
  },
  renderCrisis() {
    const c = this.crisis, S = this.S; if (!c) return;
    const C = L5_CRISIS[c.k], needOK = C.need.every(r => S.staff[r] > 0), cashOK = S.cash >= C.cost;
    const box = UI.modal({
      cls: 'crisis', title: C.name,
      html: `<div class="btnrow" style="justify-content:space-between;align-items:center"><p style="flex:1;min-width:200px">${C.desc}</p><div style="text-align:right"><div class="eyebrow" style="color:var(--stop-ink)">SLA tersisa</div><div class="sla" id="sla5">${mmss(c.left * 6)}</div></div></div>
        <dl class="kv" style="margin-top:10px"><dt>Biaya penanganan</dt><dd>${rp(C.cost)} ${cashOK ? '✓' : '<span class="tag stop">kas kurang</span>'}</dd><dt>Personel kunci</dt><dd>${C.need.map(r => `<span class="tag ${S.staff[r] ? 'go' : 'stop'}" style="margin:2px">${L5_STAFF[r].name}: ${S.staff[r]}</span>`).join('')}</dd><dt>Dampak jika gagal</dt><dd style="color:var(--stop-ink)">${C.fail}</dd></dl>
        ${needOK ? '' : `<div class="btnrow" style="margin-top:10px">${C.need.filter(r => !S.staff[r]).map(r => `<button class="btn sm" data-qh="${r}">Rekrut darurat ${L5_STAFF[r].name} (${rpShort(L5_STAFF[r].gaji * .5)})</button>`).join('')}</div>`}`,
      buttons: [{ label: `Tangani sekarang (${rpShort(C.cost)})`, cls: 'stop', disabled: !(needOK && cashOK), onClick: () => this.resolveCrisis(true) }],
      onOpen: b => $$('[data-qh]', b).forEach(x => x.onclick = () => this.hire(x.dataset.qh, 1)),
    });
  },
  resolveCrisis(ok) {
    const c = this.crisis, S = this.S, C = L5_CRISIS[c.k];
    this.crisis = null; UI.closeModal(); if (this.v) this.v.crisis(null);
    if (ok) {
      this.spend(C.cost, 'krisis'); Sfx.ok();
      const t = (c.total - c.left) * 6;
      this.addLog(`${C.name} tertangani dalam ${mmss(t)} (SLA ${mmss(C.sla)}).`, 'good');
      UI.toast(`Krisis tertangani dalam ${mmss(t)}.`, 'good');
      if (c.k === 'banjir') S.otp = Math.max(85, S.otp - 4);
    } else {
      Sfx.crash();
      this.addLog(`GAGAL menangani ${C.name}: ${C.fail}.`, 'bad');
      if (c.k === 'banjir') { S.m.acc++; S.fx.otpCut = 3; S.fx.paxCut = 2; S.csat = clamp(S.csat - .35, 1, 5); }
      if (c.k === 'blackout') { S.m.acc++; S.fx.csatCut = 2; S.fx.paxCut = 1; S.cond = Math.max(0, S.cond - 6); }
      UI.modal({ title: `SLA terlewati: ${C.name}`, cls: 'crisis', html: `<p><b>${C.fail}.</b> Insiden dicatat pada KPI Operasional &amp; Keselamatan, OTP dan kepuasan penumpang terdampak beberapa hari.</p>`, buttons: [{ label: 'Mengerti', cls: 'primary' }] });
    }
    this.renderTop(); this.renderTab();
  },
  /* ---------- small events ---------- */
  smallEvent() {
    const S = this.S;
    const pool = L5_EVENTS.filter((e, i) => !S.evDone.includes(i));
    if (!pool.length) return;
    const e = pick(pool); S.evDone.push(L5_EVENTS.indexOf(e));
    this.modalPause = true;
    UI.modal({ title: e.t, html: `<p>${e.d}</p>`, buttons: e.o.map(o => ({ label: o[0], onClick: () => { o[1](S); this.modalPause = false; UI.toast(o[2]); this.addLog(`${e.t}: ${o[0]}.`); L5Sim.updOcc(S); this.renderTop(); } })) });
  },
  /* ---------- loop ---------- */
  update(dt) {
    if (this.v) this.v.update(dt);
    if (!this.S || this.S.ended) return;
    if (this.crisis) {
      this.crisis.left -= dt; const e = $('#sla5'); if (e) e.textContent = mmss(this.crisis.left * 6);
      if (this.crisis.left <= 0) this.resolveCrisis(false);
    }
    if (this.fault) { this.fault.t += dt; this.fault.left -= dt; if (this.fault.left <= 0) { this.S.m.faults.push(null); this.S.cond = Math.max(0, this.S.cond - 2); this.fault = null; Sfx.bad(); this.addLog('Gangguan sinyal tidak ditangani: perjalanan kereta tertahan.', 'bad'); } this.renderTop(); }
    if (!this.speed) return;
    this.acc += dt * this.speed;
    if (this.acc >= DAY_LEN) { this.acc = 0; this.nextDay(); }
  },
  idle(dt) { if (this.v) this.v.update(dt * .3); },
  nextDay() {
    const S = this.S;
    // jadwal krisis & kejadian sebelum hari berjalan
    const mud = S.mudik;
    if (S.month === mud.month) {
      if (S.day === 13 && !mud.warned[13]) { mud.warned[13] = 1; Sfx.alarm(); this.addLog('Daop: masa angkutan Lebaran dimulai Hari 20. Siapkan posko (H-7).', 'warn'); if (UI.modalOpen) UI.toast('Daop: peak season mudik mulai Hari 20. Siapkan Posko Angkutan Lebaran di tab Ringkasan.', 'bad', 6000); else UI.modal({ title: 'Persiapan Angkutan Lebaran (H-7)', cls: 'crisis', html: `<p>Daop mengumumkan peak season mudik Lebaran mulai Hari 20 selama 8 hari. Permintaan diperkirakan naik lebih dari dua kali lipat.</p><p style="margin-top:8px">Siapkan <b>Posko Angkutan Lebaran</b> (Rp 25.000.000) dengan <b>seluruh staf</b> minimal sesuai rekomendasi sebelum Hari 20. Jika tidak: <b style="color:var(--stop-ink)">${L5_CRISIS.mudik.fail}</b>.</p>`, buttons: [{ label: 'Buka Ringkasan', cls: 'primary', onClick: () => { this.tab = 'sum'; this.renderHud(); } }, { label: 'Tutup' }] }); }
      if ((S.day === 17 || S.day === 19) && !mud.prepared) UI.toast(`Peringatan: posko Lebaran belum siap (H-${20 - S.day}).`, 'bad', 4000);
      if (S.day === 20) {
        mud.active = true; if (this.v) this.v.setPeople(140);
        if (!mud.prepared) { mud.failed = true; Sfx.crash(); S.csat = clamp(S.csat - .6, 1, 5); this.addLog('Peak season tanpa posko: stasiun kewalahan. Rating anjlok ke Grade D.', 'bad'); if (UI.modalOpen) UI.toast('Lonjakan mudik tidak tertangani: rating bulan ini anjlok ke Grade D.', 'bad', 6000); else UI.modal({ title: 'Lonjakan mudik tidak tertangani', cls: 'crisis', html: `<p>Hall dan peron penuh sesak, antrean mengular, jadwal kacau. Sesuai ketentuan, rating stasiun bulan ini <b>anjlok ke Grade D</b>.</p>`, buttons: [{ label: 'Mengerti', cls: 'primary' }] }); }
        else this.addLog('Peak season mudik dimulai. Posko berjalan.', 'good');
      }
      if (S.day === 28 && mud.active) { mud.active = false; this.addLog('Masa angkutan Lebaran selesai.', mud.failed ? 'bad' : 'good'); }
    }
    if (S.day === S.banjirDay && !this.crisis) this.startCrisis('banjir');
    else if (!this.crisis && S.day > 2 && chance(.018 + (S.cond < 55 ? .04 : 0))) this.startCrisis('blackout');
    if (S.day === S.inspectDay) {
      const ok = S.clean >= 90 && S.cond >= 70; S.m.inspect = ok;
      ok ? Sfx.ok() : Sfx.bad();
      this.addLog(ok ? 'Inspeksi mendadak Daop: lulus. Toilet, peron, dan fasilitas memenuhi standar.' : `Inspeksi mendadak Daop: ada temuan (kebersihan ${Math.round(S.clean)}%, kondisi ${Math.round(S.cond)}%). Pilar Kebersihan −10.`, ok ? 'good' : 'bad');
      UI.toast(ok ? 'Inspeksi Daop lulus.' : 'Inspeksi Daop menemukan masalah.', ok ? 'good' : 'bad', 3500);
    }
    const out = L5Sim.day(S);
    S.csat = clamp(S.csat, 1, 5);
    out.forEach(o => {
      if (o.k === 'acc') { Sfx.bad(); this.addLog(`Insiden: ${o.msg}.`, 'bad'); UI.toast(`Insiden keselamatan: ${o.msg}.`, 'bad', 4000); }
      if (o.k === 'fault' && !this.fault) { this.fault = { t: 0, left: 10 }; Sfx.alarm(); UI.toast('Gangguan sinyal di emplasemen! Kirim teknisi segera.', 'warn'); }
    });
    if (!this.crisis && !UI.modalOpen && S.day > 3 && S.day < 29 && chance(.075)) this.smallEvent();
    if (this.v) this.v.setPeople(S.pax / (S.tier === 1 ? 12 : S.tier === 2 ? 30 : 130));
    S.day++;
    if (S.day > 30) { S.day = 30; this.monthEnd(); }
    this.renderTop();
    if (this.tab === 'sum' || this.tab === 'fin') this.renderTab(); else this.refreshButtons();
  },
  /* ---------- evaluasi bulanan Daop ---------- */
  monthEnd() {
    const S = this.S, ev = L5Sim.evaluate(S), g = ev.grade;
    this.speed = 0; this.modalPause = true; this.fault = null;
    if (this.crisis) { this.crisis = null; UI.closeModal(); if (this.v) this.v.crisis(null); }
    const bonus = g === 'A' ? ev.rev * .2 : g === 'B' ? ev.rev * .1 : 0;
    const subsidi = ev.otp >= 95 && ev.clean >= 90 ? 15e6 * S.tier : 0;
    const consequences = [];
    if (g === 'A') consequences.push(`Bonus Kas Daop +20%: <b>${rp(bonus)}</b>`, 'Insentif staf 1,5× gaji pokok (dibayar Daop): moral staf naik', 'Akselerasi kelas stasiun: diskon 30% untuk naik kelas berikutnya');
    if (g === 'B') consequences.push(`Bonus operasional normal (10% pendapatan): <b>${rp(bonus)}</b>`, 'Sertifikat Performa Memuaskan');
    if (g === 'C') consequences.push('Surat Peringatan Pertama (SP 1)', 'Wajib action plan 3 hari', 'Pemotongan insentif 25%: moral staf turun');
    if (g === 'D') consequences.push('Audit khusus direksi', 'Pencopotan jabatan / demosi Kepala Stasiun', 'Penundaan pangkat');
    if (subsidi) consequences.push(`Subsidi & bonus performa Daop (OTP ≥ 95% dan kebersihan ≥ 90%): <b>${rp(subsidi)}</b>`);
    const rowsT = [
      ['Operasional & Keselamatan', 35, `OTP ${ev.otp.toFixed(1)}% · ${S.m.acc} insiden · sinyal ${S.m.faults.length ? (ev.fr >= 30 ? 'tidak tertangani' : ev.fr.toFixed(1) + ' dtk') : '–'}`, 'OTP ≥ 95%, 0 insiden', ev.p1],
      ['Kebersihan & Fasilitas', 25, `Kebersihan ${Math.round(ev.clean)}% · kondisi ${Math.round(ev.cond)}%${S.m.inspect === false ? ' · temuan inspeksi' : ''}`, 'Kebersihan ≥ 90%', ev.p2],
      ['Keuangan & Komersial', 20, `${pct(ev.finR)} target · okupansi ${Math.round(S.occ * 100)}% · beban ${Math.round(ev.effR * 100)}%`, 'Target ≥ 100%', ev.p3],
      ['Kepuasan Penumpang', 20, `CSAT ${ev.csat.toFixed(2)}`, 'CSAT ≥ 4,2', ev.p4],
    ];
    const score = Math.round(ev.score);
    Online.ev('end', { lv: 5, score, dur: Online.dur() });
    S.history.push({ month: S.month, tier: L5_TIER[S.tier].short, score, grade: g, rev: ev.rev });
    const best = Save.data.best[5]; if (!best || score > best.score) { Save.data.best[5] = { score, grade: g }; Save.write(); }
    Sfx[g === 'A' || g === 'B' ? 'promo' : 'bad']();
    UI.modal({
      cls: 'wide', title: `Evaluasi Bulanan PT KAI Daop · Bulan ${S.month}`,
      html: `<div class="evgrid"><div style="display:flex;gap:14px;align-items:center"><div class="score-big mono">${score}</div>${gradeBadge(g)}</div><div><b>${GRADES[g].label}</b>${ev.capped ? ' — dibatasi ke Grade D karena lonjakan mudik tidak tertangani.' : ''}<p class="muted" style="font-size:13px;margin-top:4px">${L5_TIER[S.tier].name} · pendapatan ${rp(ev.rev)} dari target ${rp(ev.target)}</p></div></div>
        <div class="tbl-wrap" style="margin-top:12px"><table class="t"><tr><th>Pilar KPI</th><th>Bobot</th><th>Realisasi</th><th>Target minimum</th><th>Skor</th></tr>${rowsT.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}%</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${Math.round(r[4])}</td></tr>`).join('')}</table></div>
        <div class="grid2" style="margin-top:12px"><div class="panel"><div class="eyebrow">Keputusan Daop</div><ul class="sop" style="margin-top:6px">${consequences.map(c => `<li>${c}</li>`).join('')}</ul></div>
        <div class="panel"><div class="eyebrow">Arus kas bulan ini</div><dl class="kv" style="margin-top:6px"><dt>Pendapatan</dt><dd>${rp(ev.rev)}</dd><dt>Beban operasional</dt><dd>${rp(ev.expOps)}</dd><dt>Investasi</dt><dd>${rp(S.m.exp.investasi)}</dd><dt>Kas akhir</dt><dd>${rp(S.cash + bonus + subsidi)}</dd></dl></div></div>`,
      buttons: [{ label: g === 'D' ? 'Terima keputusan' : (S.month >= 12 ? 'Lihat akhir masa jabatan' : `Lanjut ke Bulan ${S.month + 1}`), cls: 'primary', onClick: () => this.applyEval(ev, bonus, subsidi) }],
    });
  },
  applyEval(ev, bonus, subsidi) {
    const S = this.S, g = ev.grade;
    S.cash += bonus + subsidi; S.m.rev.daop += bonus + subsidi;
    S.lastGrade = g;
    if (g === 'A') { S.moraleMod += 15; S.accel = true; S.cConsec = 0; }
    if (g === 'B') { S.moraleMod += 4; S.cConsec = 0; }
    if (g === 'C') { S.moraleMod -= 12; S.cConsec++; }
    if (g === 'D' || S.cConsec >= 3) return this.demoted(g === 'D' ? 'Grade D pada evaluasi bulanan.' : 'Tiga kali berturut-turut mendapat Grade C (SP 1, SP 2, SP 3).');
    if (S.month >= 12) return this.ending();
    S.month++; S.day = 1; S.monthsAtTier++; L5Sim.newMonth(S);
    this.snapshot();
    this.addLog(`Bulan ${S.month} dimulai.`);
    if (g === 'C') return this.actionPlan();
    this.modalPause = false; this.speed = 1; this.renderTop(); this.renderTab();
  },
  actionPlan() {
    const S = this.S;
    UI.modal({ title: `SP ${S.cConsec}: Wajib Action Plan 3 hari`, cls: 'crisis', html: `<p>Pilih satu program perbaikan yang berjalan 3 hari pertama bulan ini.${S.cConsec >= 2 ? ' <b style="color:var(--stop-ink)">Satu kali lagi Grade C berarti demosi.</b>' : ''}</p>`,
      buttons: L5_PLANS.map(p => ({ label: `${p.name} — ${p.desc}`, cls: 'opt', onClick: () => { this.spend(p.cost, 'lain'); S.plan = p.id; S.planDays = 3; this.addLog(`Action plan: ${p.name}.`, 'warn'); this.modalPause = false; this.speed = 1; this.renderTop(); this.renderTab(); } })) });
  },
  demoted(reason) {
    const S = this.S; S.ended = true; Save.data.l5 = null; Save.write(); this.modalPause = true;
    UI.modal({ title: 'Audit Khusus Direksi', cls: 'crisis', html: `<p>${reason} Direksi memutuskan <b>pencopotan jabatan</b>. Anda didemosi kembali menjadi PPKA dan kenaikan pangkat ditunda.</p><p class="muted" style="margin-top:8px">Masa jabatan berakhir di Bulan ${S.month}. Nilai terbaik bulanan tetap tercatat di kartu karier.</p>`,
      buttons: [{ label: 'Mulai masa jabatan baru', cls: 'primary', onClick: () => Game.start(5) }, { label: 'Kembali ke kartu karier', onClick: () => Game.career() }] });
  },
  ending() {
    const S = this.S; S.ended = true; Save.data.l5 = null; Save.write(); this.modalPause = true;
    const avg = Math.round(L5Sim.avg(S.history.map(h => h.score))), g = gradeOf(avg);
    const best = S.tier === 3 && S.owned.length === L5_FAC.length && S.lastGrade === 'A';
    Sfx.promo();
    UI.modal({ cls: 'wide', title: best ? 'Stasiun Utama Teladan' : 'Akhir Masa Jabatan', html: `<div class="evgrid"><div style="display:flex;gap:14px;align-items:center"><div class="score-big mono">${avg}</div>${gradeBadge(g)}</div><div><p>${best ? 'Dari stasiun kayu Kelas III, Anda membangun Stasiun Utama dengan seluruh fasilitas Tier 3 dan menutup tahun dengan Grade A. Daop menobatkan Anda sebagai Kepala Stasiun Teladan.' : `Masa jabatan 12 bulan selesai di ${L5_TIER[S.tier].name} dengan rata-rata skor ${avg}.`}</p><p class="muted" style="margin-top:6px">Kas akhir ${rp(S.cash)} · ${S.owned.length}/${L5_FAC.length} fasilitas · ${S.history.filter(h => h.grade === 'A').length} kali Grade A.</p></div></div>`,
      buttons: [{ label: 'Kembali ke kartu karier', cls: 'primary', onClick: () => Game.career() }, { label: 'Main lagi', onClick: () => Game.start(5) }] });
  },
};

/* ================= ONLINE: telemetri anonim, masukan, tantangan harian =================
   Aktif hanya jika halaman menetapkan window.SN_API (situs Netlify: "" = origin sama;
   APK Android: URL absolut situs). Di artifact/preview tidak ada server, jadi semua fitur ini diam. */
const Online = {
  base: typeof window.SN_API === 'string' ? window.SN_API : null,
  get enabled() { return this.base !== null; },
  q: [], lv: 0, lvT: 0, daily: false, _rand: null,
  allowed() { return this.enabled && Save.data.settings.telemetry !== false; },
  sid() {
    let s = Save.data.sid;
    if (!s) {
      try { s = Array.from(crypto.getRandomValues(new Uint8Array(14)), b => (b % 36).toString(36)).join(''); }
      catch (e) { s = (Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 14); }
      Save.data.sid = s; Save.write();
    }
    return s;
  },
  ev(t, o = {}) { if (!this.allowed()) return; this.q.push(Object.assign({ t }, o)); if (this.q.length >= 20) this.flush(); },
  flush() {
    if (!this.allowed() || !this.q.length) return;
    const body = JSON.stringify({ sid: this.sid(), events: this.q.splice(0, 40) }), url = this.base + '/api/event';
    try { if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return; } catch (e) { }
    try { fetch(url, { method: 'POST', body, headers: { 'content-type': 'text/plain' }, keepalive: true }).catch(() => { }); } catch (e) { }
  },
  async req(path, data) {
    const opt = data ? { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(Object.assign({ sid: this.sid(), app: IS_APP }, data)) } : {};
    const r = await fetch(this.base + path, opt);
    let j = {}; try { j = await r.json(); } catch (e) { }
    if (!r.ok) throw new Error(j.error || 'Server tidak merespons (' + r.status + ')');
    return j;
  },
  levelStart(lv, daily) { this.lv = lv; this.lvT = performance.now(); this.daily = !!daily; this.ev('start', { lv, daily: this.daily }); },
  dur() { return Math.round((performance.now() - this.lvT) / 1000); },
  levelEnd(lv, score) { this.ev('end', { lv, score, dur: this.dur(), daily: this.daily }); this.lv = 0; this.flush(); },
  levelQuit(L) { if (!this.lv) return; this.ev('quit', { lv: this.lv, dur: this.dur(), ph: (L && (L.phase || L.mode)) || '', daily: this.daily }); this.lv = 0; this.flush(); },
  // RNG deterministik untuk tantangan harian (mulberry32), dipasang sementara menggantikan Math.random
  seed(seed) {
    if (!this._rand) this._rand = Math.random;
    let a = seed >>> 0;
    Math.random = function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  },
  unseed() { if (this._rand) { Math.random = this._rand; this._rand = null; } },
  init() {
    if (!this.enabled) return;
    setInterval(() => this.flush(), 15000);
    addEventListener('pagehide', () => this.flush());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.flush(); });
    this.ev('open', {});
  },
};

const PASS_SCORE = 75;

const Game = {
  level: null, paused: false, last: 0, titleView: null,
  boot() {
    Save.load(); UI.init(); GL.init();
    const mkTitle = () => { if (GL.ok && !this.titleView) { this.titleView = makeTitleScene(); if (!this.level) GL.use(this.titleView); } };
    let fontsP = Promise.resolve();
    try { if (document.fonts && document.fonts.load) fontsP = Promise.all(['700 64px "Fredoka"', '600 20px "Nunito"'].map(f => document.fonts.load(f))); } catch (e) { }
    Promise.race([fontsP, new Promise(r => setTimeout(r, 1800))]).catch(() => { }).then(mkTitle);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.level && !UI.modalOpen) this.pauseMenu();
      this.level && this.level.key && !this.paused && !UI.modalOpen && this.level.key(e);
    });
    document.addEventListener('pointerdown', () => Sfx.ensure(), { once: true });
    Online.init();
    const start = () => { this.title(); requestAnimationFrame(t => this.loop(t)); };
    window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
  },
  loop(t) {
    const dt = Math.min(.05, (t - (this.last || t)) / 1000); this.last = t;
    try {
      if (this.level) { if (!this.paused && !this.level.modalPause) this.level.update(dt); else if (this.level.idle) this.level.idle(dt); }
      else if (this.titleView && GL.view === this.titleView) this.titleView.update(dt);
      if (GL.ok) MK.tick(dt);
      GL.render();
    } catch (e) { console.error(e); }
    requestAnimationFrame(t2 => this.loop(t2));
  },
  setCanvas(mode) { // 'gl' | 'ppka' | 'none'
    GL.active = mode === 'gl';
    $('#gl').classList.toggle('hide', mode !== 'gl');

  toTitleView() { this.setCanvas('gl'); if (GL.ok && this.titleView) GL.use(this.titleView); },
  exitLevel() {
    if (this.level) { Online.levelQuit(this.level); try { this.level.cleanup && this.level.cleanup(); } catch (e) { console.error(e); } }

       <div class="grid2" style="margin-top:12px">${Object.entries(GRADES).map(([g, v]) => `<div class="panel" style="display:flex;gap:10px;align-items:flex-start">${gradeBadge(g)}<div><b>${g === 'A' ? '90–100' : g === 'B' ? '75–89' : g === 'C' ? '60–74' : '&lt; 60'}</b><p class="muted" style="font-size:13px">${v.reward}</p></div></div>`).join('')}</div>`,
